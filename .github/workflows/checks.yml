name: checks

on:
  push:
    branches: [main]
  pull_request:
  # /ship dispatches a run after flipping the repo public, since the flip
  # itself triggers no push event.
  workflow_dispatch:

# One deploy at a time, and never cancel one mid-flight.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    # Runs once the repo is public; until then `pnpm check` is the same
    # sensors, locally.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the secret scan can see all commits
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Pull the pinned maintained browser image
        timeout-minutes: 5
        run: bash tools/ci-browser.sh --pull
      - name: Build and start the app
        # the same image Fly deploys, with a throwaway /data in place of the
        # volume; the spec runs against it
        run: |
          docker build -t app .
          # PUBLIC_ORIGIN matches browser Origin exactly. Chromium accepts
          # Secure cookies on localhost; keep production cookie protection on.
          docker run -d --init --name app -p 127.0.0.1:8080:8080 \
            -e PORT=8080 -e PUBLIC_ORIGIN=http://localhost:8080 --tmpfs /data app
          if ! timeout 60s bash -c \
            'until curl --connect-timeout 1 --max-time 2 --fail --silent http://localhost:8080/healthz >/dev/null; do sleep 1; done'; then
            echo "app did not become healthy within 60 seconds"
            exit 1
          fi
      - name: Run the spec
        run: pnpm check
        env:
          APP_URL: http://localhost:8080
      - name: Verify the maintained browser core against the image
        timeout-minutes: 5
        run: bash tools/ci-browser.sh
        env:
          APP_URL: http://localhost:8080
          EXPECT_SECURE_COOKIES: 'true'
      - name: Run the registered combined board workload
        id: registered_resource
        timeout-minutes: 8
        # A reported Ubuntu runner, with the same frozen task/bounds; not Fly performance.
        # One attempt. Earlier failed WSL trials remain in their separate committed files.
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync, spawnSync } from "node:child_process";
          import { rmSync } from "node:fs";
          // This disposable checkout must not upload an older result if startup fails.
          rmSync("evaluation/board-resource.results.json", { force: true });
          const ready = JSON.parse(execFileSync(process.execPath, ["tools/board-resource.mjs", "--inspect"], { encoding: "utf8" }));
          if (ready.status !== "READY") throw new Error("Registered resource source is not ready");
          const run = spawnSync(process.execPath, ["tools/board-resource.mjs", "--run", "--go", ready.protocolSHA256, "--freeze", ready.sourceManifestSHA256], { stdio: "inherit" });
          process.exit(run.status ?? 1);
          NODE
      - name: Preserve the sanitized resource result
        if: ${{ !cancelled() && steps.registered_resource.outcome != 'skipped' }}
        uses: actions/upload-artifact@v5
        with:
          name: registered-board-resource
          path: evaluation/board-resource.results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve browser failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: browser-core
          path: |
            .local/browser-report/
            .local/browser-results/
            .local/browser-environment/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Show the app's output
        # what the container printed, so a crash or slow boot is visible
        if: ${{ failure() }}
        run: docker logs app
      - name: Check the process evidence
        # skipped in the template repo itself, where PROCESS.md is still the
        # boilerplate every student replaces
        if: ${{ !github.event.repository.is_template }}
        run: pnpm check:evidence
      - name: Scan for committed secrets
        # Pinned in both halves (action SHA and scanner image) because this
        # runs in every repo in the course. Bump between semesters.
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: --only-verified
      - name: Scan for a committed course key
        # A course key has no verifier a runner can reach, so this pass
        # matches its shape instead (.github/trufflehog.yml).
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: >-
            --config=.github/trufflehog.yml
            --include-detectors=CustomRegex --results=unverified
            --no-verification
      - name: Remove the disposable app
        if: ${{ always() }}
        run: docker rm -f app || true

  deploy:
    needs: check
    # The template repo itself has no Fly app; only student repos deploy.
    if: ${{ !github.event.repository.private && !github.event.repository.is_template && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # Registers the GitHub Deployment with the live URL. The app is named
    # after this repo, so the URL needs no lookup.
    environment:
      name: fly
      url: https://${{ github.event.repository.name }}.fly.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_URL: https://${{ github.event.repository.name }}.fly.dev
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Verify private mounted SQLite backups
        timeout-minutes: 3
        # Existing app/token; online per-file copies stay private on the mounted volume.
        run: node tools/backup-mounted-data.mjs
      - name: Deploy
        # --remote-only builds the Dockerfile on Fly's builders; --ha=false
        # keeps the app at one machine and one volume.
        run: flyctl deploy --remote-only --ha=false -a ${{ github.event.repository.name }}
      - name: Verify the deployed site is online
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL" || true)
            if [ "$code" = "200" ]; then echo "online: $APP_URL"; exit 0; fi
            echo "attempt $i: HTTP $code, retrying in 10s..."
            sleep 10
          done
          echo "site did not return 200"; exit 1
