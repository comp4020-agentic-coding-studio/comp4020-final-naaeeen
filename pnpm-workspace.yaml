# esbuild (used by Vitest) needs its postinstall to set up its native binary.
allowBuilds:
  esbuild: true
  # Sass file-watching is unused; skip its optional native build script.
  "@parcel/watcher": false

# Compatible patched transitive builds used by the isolated browser editor.
# Keep this explicit: dev dependencies are shipped in browser bundles too.
overrides:
  'nanoid@3.3.3': 3.3.18
  'nanoid@4.0.2': 5.1.16
  lodash-es: 4.18.1
  source-map-js: 1.2.2
  katex: 0.19.0
  '@excalidraw/excalidraw>sass': 1.105.1
